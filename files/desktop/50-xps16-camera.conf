# popos2604-xps16-audio-camera
# Hide the ~40 raw "ipu7" V4L2 capture nodes from apps. They never give a
# usable picture (raw Bayer, no ISP). Apps should pick the libcamera camera,
# shown as "Built-in Front Camera".
# Also hide the "Zoom Camera" v4l2loopback device (fed FROM PipeWire for
# V4L2-only apps); listing it in PipeWire would offer a camera that loops
# back into itself.
monitor.v4l2.rules = [
  {
    matches = [ { device.product.name = "ipu7" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { device.product.name = "Zoom Camera" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
